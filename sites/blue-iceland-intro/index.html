<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冰洞探险 · 出发前须知 | Blue Iceland</title>
<meta name="description" content="Blue Iceland 冰洞探险：出发前请看这段短片。">
<meta property="og:title" content="冰洞探险 · 出发前须知 | Blue Iceland">
<meta property="og:image" content="video/poster.jpg">
<meta name="theme-color" content="#14305A">
<style>
  html, body { margin: 0; height: 100%; background: #14305A; overflow: hidden; }
  body { display: grid; place-items: center; height: 100dvh; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  .wrap { position: relative; height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; }
  @media (max-aspect-ratio: 9/16) { .wrap { width: 100vw; height: auto; } }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: #0b1a30; }
  #sound {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
    border: 0; border-radius: 999px; padding: 14px 26px; font: inherit; font-size: 18px; font-weight: 600;
    color: #14305A; background: rgba(255, 253, 248, 0.95); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); cursor: pointer;
  }
  #sound small { display: block; font-size: 13px; font-weight: 500; color: #5D6B78; }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <video id="v" autoplay muted playsinline webkit-playsinline preload="auto" poster="video/poster.jpg">
    <source src="video/intro.mp4" type="video/mp4">
  </video>
  <button id="sound" type="button">🔊 点击开启声音<small>Tap for sound</small></button>
</div>
<script>
  // Phones only allow autoplay without sound: the video starts muted, and one tap restarts it with sound.
  const v = document.getElementById('v'), b = document.getElementById('sound');
  v.play().catch(() => { b.firstChild.textContent = '▶ 点击播放'; });
  b.addEventListener('click', () => {
    v.muted = false; v.currentTime = 0; v.controls = true;
    v.play(); b.hidden = true;
  });
  v.addEventListener('volumechange', () => { if (!v.muted) b.hidden = true; });
</script>
</body>
</html>
